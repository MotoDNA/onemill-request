<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>홈페이지 수정요청 접수 | ONEMILL</title>
<style>
  :root {
    --ink: #16181d; --sub: #5b6270; --line: #e3e6eb; --bg: #f5f6f8; --card: #ffffff;
    --accent: #1f4fd8; --accent-ink: #ffffff; --ok: #12805c; --warn: #b25e09; --err: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 60px; }
  header { margin-bottom: 20px; }
  .brand { font-size: 12px; letter-spacing: .18em; font-weight: 700; color: var(--sub); }
  h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 0; }
  h2 { font-size: 17px; margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  label:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: 13px; }
  input[type=text], input[type=password], textarea {
    width: 100%; border: 1px solid #cfd4dc; border-radius: 10px; padding: 12px 13px; font: inherit; color: inherit; background: #fff; }
  textarea { min-height: 150px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(31,79,216,.25); border-color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  .btn { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .link { background: none; border: 0; color: var(--sub); text-decoration: underline; padding: 0; font-size: 13px; }
  .msg { margin-top: 14px; padding: 11px 13px; border-radius: 10px; font-size: 14px; }
  .msg.err { background: #fdecea; color: var(--err); }
  .msg.ok { background: #e7f6ef; color: var(--ok); }
  .filebox { border: 1.5px dashed #c3c9d3; border-radius: 10px; padding: 14px; text-align: center; color: var(--sub); font-size: 14px; background: #fafbfc; }
  .filebox input { display: none; }
  .filebox b { color: var(--accent); }
  ul.files { list-style: none; margin: 10px 0 0; padding: 0; }
  ul.files li { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 14px; padding: 7px 10px; background: var(--bg); border-radius: 8px; margin-top: 6px; }
  ul.files span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.files button { border: 0; background: none; color: var(--err); font-size: 13px; flex: none; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .item { border-top: 1px solid var(--line); padding: 16px 0; }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item:last-child { padding-bottom: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--sub); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .s-new { background: #e8eefc; color: var(--accent); }
  .s-work { background: #fdf1e0; color: var(--warn); }
  .s-done { background: #e7f6ef; color: var(--ok); }
  .s-hold { background: #eceef1; color: var(--sub); }
  .body { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; font-size: 15px; }
  .reply { margin-top: 10px; padding: 10px 12px; background: var(--bg); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .reply b { display: block; font-size: 12px; color: var(--sub); margin-bottom: 2px; }
  .empty { color: var(--sub); font-size: 14px; margin: 0; }
  .center { text-align: center; color: var(--sub); }
  footer { text-align: center; color: #9aa1ad; font-size: 12px; margin-top: 26px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">ONEMILL</div>
    <h1 id="title">홈페이지 수정요청 접수</h1>
  </header>

  <!-- 안내(잘못된 링크 등) -->
  <section class="card center" id="viewNotice" hidden><p id="noticeText"></p></section>

  <!-- 비밀번호 입력 -->
  <section class="card" id="viewLogin" hidden>
    <h2>비밀번호를 입력해 주세요</h2>
    <form id="loginForm" autocomplete="off">
      <label for="pw">비밀번호 <span class="hint">· 담당자에게 받은 비밀번호</span></label>
      <input type="password" id="pw" required autofocus>
      <button class="btn" id="loginBtn" type="submit">들어가기</button>
      <div class="msg err" id="loginMsg" hidden></div>
    </form>
  </section>

  <!-- 접수 화면 -->
  <div id="viewMain" hidden>
    <section class="card">
      <div class="top"><h2>새 수정요청</h2><button class="link" id="logoutBtn" type="button">나가기</button></div>
      <form id="reqForm">
        <label for="page">수정할 페이지 <span class="hint">· 예) 메인, 회사소개, 오시는 길</span></label>
        <input type="text" id="page" maxlength="200" placeholder="어느 페이지인지 적어 주세요">

        <label for="content">수정 내용 <span class="hint">· 여러 건이면 번호를 붙여 주세요</span></label>
        <textarea id="content" maxlength="5000" required placeholder="예)&#10;1. 메인 상단 문구를 &quot;30년 전통의 제본 전문&quot;으로 변경&#10;2. 오시는 길의 전화번호를 031-000-0000 으로 수정&#10;3. 첨부한 사진으로 대표 이미지 교체"></textarea>

        <label>사진·파일 첨부 <span class="hint">· 최대 5개, 개당 5MB (사진은 자동으로 줄여서 올립니다)</span></label>
        <label class="filebox" for="file"><input type="file" id="file" multiple
          accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.hwpx,.txt,.zip,.ai,.psd,.svg"><b>파일 선택</b> 을 눌러 첨부하세요</label>
        <ul class="files" id="fileList"></ul>

        <button class="btn" id="sendBtn" type="submit">수정요청 보내기</button>
        <div class="msg" id="sendMsg" hidden></div>
      </form>
    </section>

    <section class="card">
      <h2>접수 내역</h2>
      <div id="list"><p class="empty">아직 접수된 요청이 없습니다.</p></div>
    </section>
  </div>

  <footer>ONEMILL · 디엔에이랩스</footer>
</div>

<script>
/* ───── 설정: 배포한 Apps Script 웹 앱 주소를 아래 따옴표 안에 붙여넣으세요 ───── */
const API_URL = 'https://script.google.com/macros/s/AKfycbwvJaVc8Pxnjs2e2-UCK5_kqvNkE5of4IHcEjRke4m56VUPio2hIYRbtP2BZAzxFF38/exec';

const MAX_FILES = 5, MAX_BYTES = 5 * 1024 * 1024, SHRINK_OVER = 1.5 * 1024 * 1024, MAX_SIDE = 2400;
const $ = id => document.getElementById(id);
const cid = (new URLSearchParams(location.search).get('c') || '').trim();
const store = {
  get() { try { return sessionStorage.getItem('pw_' + cid) || ''; } catch (e) { return ''; } },
  set(v) { try { v ? sessionStorage.setItem('pw_' + cid, v) : sessionStorage.removeItem('pw_' + cid); } catch (e) {} }
};
let pw = '';
let picked = [];

const ERR = {
  AUTH: '비밀번호가 맞지 않습니다. 다시 확인해 주세요.',
  LOCKED: '비밀번호를 여러 번 틀려 잠시 잠겼습니다. 10분 뒤 다시 시도해 주세요.',
  EMPTY: '수정 내용을 입력해 주세요.',
  TOO_LONG: '내용이 너무 깁니다. 5,000자 이내로 나눠서 보내 주세요.',
  TOO_MANY_FILES: '파일은 한 번에 5개까지 첨부할 수 있습니다.',
  FILE_TYPE: '첨부할 수 없는 파일 형식이 있습니다.',
  FILE_SIZE: '5MB 를 넘는 파일이 있습니다.',
  SERVER: '일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.',
  NETWORK: '연결에 실패했습니다. 인터넷 상태를 확인한 뒤 다시 시도해 주세요.'
};
const errText = r => ERR[r && r.error] || ERR.SERVER;

async function api(payload) {
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'NETWORK' };
  }
}

function show(view) {
  ['viewNotice', 'viewLogin', 'viewMain'].forEach(v => { $(v).hidden = v !== view; });
}
function notice(text) { $('noticeText').textContent = text; show('viewNotice'); }
function setMsg(el, text, kind) {
  el.hidden = !text; el.textContent = text || ''; el.className = 'msg' + (kind ? ' ' + kind : '');
}

/* ───── 로그인 ───── */
async function login(password, silent) {
  $('loginBtn').disabled = true; $('loginBtn').textContent = '확인 중…';
  const r = await api({ action: 'login', c: cid, pw: password });
  $('loginBtn').disabled = false; $('loginBtn').textContent = '들어가기';
  if (!r.ok) {
    store.set('');
    show('viewLogin');
    if (!silent) setMsg($('loginMsg'), errText(r), 'err');
    return;
  }
  pw = password; store.set(password);
  $('title').textContent = r.name + ' 홈페이지 수정요청';
  renderList(r.requests);
  show('viewMain');
}

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  setMsg($('loginMsg'), '');
  login($('pw').value);
});
$('logoutBtn').addEventListener('click', () => {
  pw = ''; store.set(''); $('pw').value = ''; picked = []; renderFiles();
  $('title').textContent = '홈페이지 수정요청 접수';
  show('viewLogin');
});

/* ───── 접수 내역 ───── */
const BADGE = { '접수': 's-new', '작업중': 's-work', '반영완료': 's-done', '보류': 's-hold' };
const LABEL = { '접수': '접수됨', '작업중': '작업 중', '반영완료': '반영 완료', '보류': '보류' };
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function renderList(items) {
  const box = $('list');
  box.textContent = '';
  if (!items || !items.length) { box.appendChild(el('p', 'empty', '아직 접수된 요청이 없습니다.')); return; }
  items.forEach(it => {
    const row = el('div', 'item');
    const meta = el('div', 'meta');
    meta.appendChild(el('span', 'badge ' + (BADGE[it.status] || 's-new'), LABEL[it.status] || it.status));
    meta.appendChild(el('span', '', it.created_at));
    meta.appendChild(el('span', '', it.req_id));
    if (it.page) meta.appendChild(el('span', '', '· ' + it.page));
    if (it.files) meta.appendChild(el('span', '', '· 첨부 ' + it.files + '개'));
    row.appendChild(meta);
    row.appendChild(el('p', 'body', it.content));
    if (it.reply) {
      const rep = el('div', 'reply');
      rep.appendChild(el('b', '', '담당자 답변' + (it.done_at ? ' · ' + it.done_at : '')));
      rep.appendChild(document.createTextNode(it.reply));
      row.appendChild(rep);
    }
    box.appendChild(row);
  });
}

/* ───── 파일 첨부 ───── */
function renderFiles() {
  const ul = $('fileList');
  ul.textContent = '';
  picked.forEach((f, i) => {
    const li = el('li');
    li.appendChild(el('span', '', f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + 'MB)'));
    const x = el('button', '', '삭제');
    x.type = 'button';
    x.addEventListener('click', () => { picked.splice(i, 1); renderFiles(); });
    li.appendChild(x);
    ul.appendChild(li);
  });
}
$('file').addEventListener('change', e => {
  const add = Array.from(e.target.files || []);
  e.target.value = '';
  if (picked.length + add.length > MAX_FILES) { setMsg($('sendMsg'), ERR.TOO_MANY_FILES, 'err'); return; }
  setMsg($('sendMsg'), '');
  picked = picked.concat(add);
  renderFiles();
});

function readAsDataURL(blob) {
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(blob); });
}
/* 휴대폰 사진은 용량이 커서, 큰 사진은 화면에서 줄인 뒤 올린다 */
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size <= SHRINK_OVER) return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) {
    return file;
  }
}

/* ───── 접수 보내기 ───── */
$('reqForm').addEventListener('submit', async e => {
  e.preventDefault();
  const content = $('content').value.trim();
  if (!content) { setMsg($('sendMsg'), ERR.EMPTY, 'err'); return; }
  const btn = $('sendBtn');
  btn.disabled = true; btn.textContent = '보내는 중…';
  setMsg($('sendMsg'), '');
  try {
    const files = [];
    for (const f0 of picked) {
      const f = await shrinkImage(f0);
      if (f.size > MAX_BYTES) { setMsg($('sendMsg'), '"' + f0.name + '" 파일이 5MB 를 넘습니다. 용량을 줄이거나 빼고 다시 보내 주세요.', 'err'); return; }
      const dataUrl = await readAsDataURL(f);
      files.push({ name: f.name, type: f.type, data: String(dataUrl).split(',')[1] || '' });
    }
    const r = await api({ action: 'submit', c: cid, pw: pw, page: $('page').value.trim(), content: content, files: files });
    if (!r.ok) {
      if (r.error === 'AUTH' || r.error === 'LOCKED') { store.set(''); show('viewLogin'); setMsg($('loginMsg'), errText(r), 'err'); return; }
      setMsg($('sendMsg'), errText(r) + (r.file ? ' (' + r.file + ')' : ''), 'err');
      return;
    }
    $('page').value = ''; $('content').value = ''; picked = []; renderFiles();
    renderList(r.requests);
    setMsg($('sendMsg'), '접수되었습니다. 접수번호 ' + r.req_id + ' · 진행 상태는 아래 접수 내역에서 확인하실 수 있습니다.', 'ok');
  } finally {
    btn.disabled = false; btn.textContent = '수정요청 보내기';
  }
});

/* ───── 시작 ───── */
(function start() {
  if (API_URL.indexOf('http') !== 0) { notice('접수 시스템 설정이 아직 끝나지 않았습니다. 담당자에게 문의해 주세요.'); return; }
  if (!/^[a-z0-9]{8,40}$/.test(cid)) { notice('접수 링크가 올바르지 않습니다. 담당자에게 받은 링크를 다시 확인해 주세요.'); return; }
  const saved = store.get();
  if (saved) login(saved, true); else show('viewLogin');
})();
</script>
</body>
</html>
